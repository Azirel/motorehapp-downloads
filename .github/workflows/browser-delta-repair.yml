name: Temporary browser delta repair
on: workflow_dispatch
permissions:
  contents: read
jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install bsdiff4==1.2.6
      - name: Build verified per-file delta
        shell: python
        run: |
          import urllib.request,zipfile,hashlib,json,pathlib,bsdiff4
          root=pathlib.Path('delta');root.mkdir()
          old='156.0.8078.70';new='156.0.8078.80'
          for v in [old,new]:
            urllib.request.urlretrieve(f'https://storage.googleapis.com/chrome-for-testing-public/{v}/linux64/chrome-headless-shell-linux64.zip',v+'.zip')
          assert hashlib.sha256(pathlib.Path(new+'.zip').read_bytes()).hexdigest()=='547dcd374e02961bf998f6046a267644f8502225c36bb78ca307dab32a0b3eb4'
          before=zipfile.ZipFile(old+'.zip');after=zipfile.ZipFile(new+'.zip')
          manifest={'archiveSha256':'547dcd374e02961bf998f6046a267644f8502225c36bb78ca307dab32a0b3eb4','baseVersion':old,'version':new,'files':[]}
          for i,info in enumerate(after.infolist()):
            if info.is_dir():continue
            name=info.filename;data=after.read(name);base=before.read(name) if name in before.namelist() else b''
            record={'path':name.split('/',1)[1],'mode':(info.external_attr>>16)&511,'sha256':hashlib.sha256(data).hexdigest(),'baseSha256':hashlib.sha256(base).hexdigest()}
            if data==base:record['kind']='copy'
            else:
              patch=bsdiff4.diff(base,data)
              record['kind']='patch' if len(patch)<len(data) else 'full'
              record['asset']=str(i)+'.bin';(root/record['asset']).write_bytes(patch if record['kind']=='patch' else data)
            manifest['files'].append(record)
          (root/'manifest.json').write_text(json.dumps(manifest))
          print('Transfer size:',sum(p.stat().st_size for p in root.iterdir()))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-browser-delta
          path: delta/
          retention-days: 1

name: Temporary browser repair
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned official Chrome archive
        run: |
          curl --fail --location --retry 3 --output browser.zip https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-headless-shell-linux64.zip
          echo "547dcd374e02961bf998f6046a267644f8502225c36bb78ca307dab32a0b3eb4  browser.zip" | sha256sum --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-browser
          path: browser.zip
          compression-level: 0
          retention-days: 1
